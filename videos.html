  <meta property="og:type" content="website" />

  <meta property="og:description" content="양양군 농촌활성화지원센터 활동영상 모음 페이지입니다." />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #4f7e66;
      --primary-dark: #3e6452;
      --text: #1f2a26;
      --muted: #55615b;
      --card: #ffffff;
      --line: #e6e6e6;
      --bg: #f5f6f3;
      --radius: 16px;
      --shadow: 0 8px 18px rgba(0, 0, 0, .06);
    }

    body {
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffffcc;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e5e5;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .logo {
      font-weight: 700;
      font-size: 1.12rem;
    }

    .logo span {
      color: #5b8a72;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
    }

    .nav-links a {
      padding: 4px 8px;
      border-radius: 999px;
    }

    .nav-links a:hover {
      background: #5b8a72;
      color: #fff;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: #333;
      cursor: pointer;
      padding: 4px;
    }

    main {
      padding: 48px 0 60px;
    }

    .page-title {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .page-sub {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 26px;
    }

    .video-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .video-list-scroll {
      max-height: 560px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .video-card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid #e5e5e5;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-card-thumb {
      background: #f4f6f3;
      background-image: url("images/hero-home.svg");
      background-size: cover;
      background-position: center;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-card-thumb img {
      background: #f4f6f3;
      background-image: url("images/hero-home.svg");
      background-size: cover;
      background-position: center;
    }

    .video-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-card-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-card-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-card-placeholder {
      font-size: 0.85rem;
      color: #888;
    }

    .video-card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .video-card-type {
      font-size: 0.75rem;
      color: #5b8a72;
      font-weight: 600;
    }

    .video-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: #222;
    }

    .video-card-date {
      font-size: 0.8rem;
      color: #777;
    }

    .video-card-link {
      margin-top: 6px;
      align-self: flex-start;
      padding: 6px 12px;
      border-radius: 999px;
      background: #5b8a72;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .video-card-link:hover {
      background: #4a735f;
    }

    .video-empty {
      text-align: center;
      color: #777;
      padding: 28px 0;
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid #e5e5e5;
    }

    footer {
      padding: 16px 0 24px;
      background: #f6f7f5;
      color: #555;
      font-size: .85rem;
      letter-spacing: 0.02em;
    }

    footer .container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (max-width:768px) {
      .mobile-menu-btn {
        display: none !important;
      }

      .nav {
        flex-direction: column;
        align-items: flex-start;
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .nav-links {
        display: flex !important;
        flex-wrap: wrap;
        width: 100%;
        gap: 8px 10px;
        margin-top: 12px;
        justify-content: flex-start;
      }

      .nav-links a {
        font-size: 0.95rem;
        padding: 6px 12px;
        background: #f4f6f3;
        border-radius: 999px;
        color: #333;
        font-weight: 600;
      }

      .nav-links a:hover {
        background: #5b8a72;
        color: #fff;
      }

      main {
        padding: 36px 0 50px;
      }

      .page-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <div class="logo">양양군 <span>농촌활성화지원센터</span></div>
      <nav class="nav-links">
        <a href="index.html#about">홈</a>
        <a href="index.html#programs">주요사업</a>
        <a href="index.html#teachers">강사진</a>
        <a href="notice.html">공지사항</a>
        <a href="index.html#contact">오시는길</a>
        <a href="qna.html">Q&A</a>
      </nav>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const navLinks = document.querySelector('.nav-links');
      if (mobileBtn && navLinks) {
        mobileBtn.addEventListener('click', () => {
          navLinks.classList.toggle('is-mobile-open');
        });
      }

      const links = document.querySelectorAll('.nav-links a');
      links.forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) {
            navLinks.classList.remove('is-mobile-open');
          }
        });
      });
    });
  </script>

  <main>
    <div class="container">
      <h1 class="page-title">활동영상</h1>
      <p class="page-sub">
        센터의 주요 행사와 활동을 영상으로 모아봤습니다. 영상을 클릭하면 상세페이지로 이동합니다.
      </p>

      <div class="video-list-scroll">
        <div id="video-list" class="video-list-grid"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div>© <span id="year"></span> 양양군 농촌활성화지원센터. All rights reserved.</div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/videos.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
