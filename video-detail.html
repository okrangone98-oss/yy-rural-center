  <meta property="og:description" content="양양군 농촌활성화지원센터 활동영상 상세 페이지입니다." />

  <meta name="twitter:card" content="summary_large_image" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #086550;
      --primary-dark: #07624c;
      --text: #1f2a26;
      --muted: #55615b;
      --card: #ffffff;
      --line: #e6e6e6;
      --bg: #f5f6f3;
      --radius: 16px;
      --shadow: 0 10px 24px rgba(0, 0, 0, .08);
    }

    body {
      font-family: "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #ffffffcc;
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e5e5e5;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
    }

    .logo {
      font-weight: 700;
      font-size: 1.12rem;
    }

    .logo span {
      color: #086550;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
    }

    .nav-links a {
      padding: 4px 8px;
      border-radius: 999px;
    }

    .nav-links a:hover {
      background: #086550;
      color: #fff;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: #333;
      cursor: pointer;
      padding: 4px;
    }

    main {
      padding: 42px 0 60px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #086550;
      margin-bottom: 16px;
    }

    .video-detail {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid #e5e5e5;
      box-shadow: var(--shadow);
      padding: 22px 24px 26px;
    }

    .video-detail-header {
      margin-bottom: 12px;
    }

    .video-detail-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-detail-type {
      font-size: 0.78rem;
      color: #086550;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-detail-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .video-detail-date {
      font-size: 0.86rem;
      color: #777;
      margin-bottom: 16px;
    }

    .video-detail-media {
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      background: #f2f4f2;
    }

    .video-detail-media video,
    .video-detail-media img {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-embed {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }

    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .video-detail-desc {
      font-size: 0.95rem;
      color: #333;
      line-height: 1.7;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .video-detail-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 999px;
      background: #086550;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .video-detail-link:hover {
      background: #4a735f;
    }

    .video-empty {
      text-align: center;
      color: #777;
      padding: 28px 0;
    }

    footer {
      padding: 16px 0 24px;
      background: #f6f7f5;
      color: #555;
      font-size: .85rem;
      letter-spacing: 0.02em;
      margin-top: 40px;
    }

    footer .container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (max-width:768px) {
      .mobile-menu-btn {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-links {
        display: none;
      }

      .nav-links.is-mobile-open {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.98);
        padding: 24px 20px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        border-bottom: 1px solid #e5e5e5;
        align-items: flex-start;
        gap: 16px;
        z-index: 20;
      }

      .nav-links.is-mobile-open a {
        font-size: 1.05rem;
        font-weight: 700;
        padding: 8px 0;
        width: 100%;
        color: #333;
      }

      .nav-links.is-mobile-open a:hover {
        background: transparent;
        color: #086550;
      }

      main {
        padding: 32px 0 50px;
      }

      .video-detail-title {
        font-size: 1.35rem;
      }

      .video-detail {
        padding: 18px 18px 22px;
      }
    }

    /* 소형 모바일 (≤640px) 보강 */
    @media (max-width: 640px) {
      main {
        padding: 24px 0 40px;
      }

      .back-link {
        font-size: 0.88rem;
        margin-bottom: 12px;
      }

      .video-detail {
        padding: 14px 14px 20px;
        border-radius: 14px;
      }

      .video-detail-title {
        font-size: 1.2rem;
        line-height: 1.4;
        word-break: keep-all;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <div class="logo">양양군 <span>농촌활성화지원센터</span></div>
      <nav class="nav-links">
        <a href="index.html#about">홈</a>
        <a href="index.html#programs">주요사업</a>
        <a href="index.html#teachers">강사진</a>
        <a href="notice.html">공지사항</a>
        <a href="index.html#gallery">활동사진</a>
        <a href="index.html#contact">오시는길</a>
        <a href="qna.html">Q&A</a>
      </nav>
      <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="메뉴 열기">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const navLinks = document.querySelector('.nav-links');
      if (mobileBtn && navLinks) {
        mobileBtn.addEventListener('click', () => {
          navLinks.classList.toggle('is-mobile-open');
        });
      }

      const links = document.querySelectorAll('.nav-links a');
      links.forEach(link => {
        link.addEventListener('click', () => {
          if (window.innerWidth <= 768) {
            navLinks.classList.remove('is-mobile-open');
          }
        });
      });
    });
  </script>

  <main>
    <div class="container">
      <a class="back-link" href="videos.html">← 활동영상 목록으로</a>
      <div id="video-detail" class="video-detail"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div>© <span id="year"></span> 양양군 농촌활성화지원센터. All rights reserved.</div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/videos.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
